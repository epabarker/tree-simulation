name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/rust
      - run: npm ci
      - name: Lint, typecheck, tests (incl. golden hashes)
        run: npm run check
      - run: npm run build
      - name: Garden build, within its size budget (ADR 0014)
        run: npm run build:garden
      - name: Headless smoke run
        run: npm run sim -- --seasons 10 --out runs/ci
