<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden 0.17 RC phone soak</title>
<style>body{margin:0;font:16px system-ui;color:#262b28;background:#faf9f5}header{padding:12px}h1{font-size:19px;margin:0 0 8px}button{font:inherit;padding:9px;margin:3px}#garden{width:100%;height:70vh}p{margin:8px 0}#status{font-size:14px}</style>
<header><h1>Garden 0.17 RC — local phone soak</h1><p>Keep open for one hour. Try the specimen and return, then background and resume. Report any freeze, reload or drawing fault.</p><button id="forest">Garden</button><button id="specimen">Oak specimen</button><p id="status">Starting…</p></header><div id="garden"></div>
<script type="module">
import {mountGarden} from '/src/web/garden.ts';
let focus='forest',season=0,started=Date.now();
const status=document.querySelector('#status');
window.garden=mountGarden(document.querySelector('#garden'),{headroom:140,seed:3,specimen:'oak',onSnapshot:s=>{season=s.season;}});
for(const name of ['forest','specimen'])document.querySelector('#'+name).onclick=()=>{focus=name;window.garden.setFocus(name);};
setInterval(()=>{status.textContent=`${focus==='forest'?'Garden':'Specimen'} · season ${season} · ${Math.floor((Date.now()-started)/60000)} minutes elapsed`;},1000);
</script></html>
