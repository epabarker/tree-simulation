# M27b: hand adjustments on top of the round-2 fits (docs/experiments/fits/<species>.json), each
# with its reason. analysis/experiments/m27_adopt.py applies them and writes src/core/flora-fitted.ts.
# Measured with the hold-out's tests: survival light in the shade house, the mixed wood over 400
# seasons (12 seeds), and the lab woods over 200 (docs/experiments/2026-10-28-m27-fits.md, M27b).

[holly]
# The fit raised Q_ss (0.03 → 0.059) and m_f (0.03 → 0.049) chasing an estimated height and floor:
# holly then needed 8.5% light (band 2–5%) and starved under the fitted beech and hornbeam, whose
# measured floors are 1.3–1.5%, vanishing from the mixed wood. Evergreen leaves live several years,
# so their yearly cost is low; seedlings emerge densest in closed holly woodland (Arrieta et al.
# 2005); a facultative understorey tree in oceanic climates (Valladares et al. 2005).
"r6.qMin" = 0.013
"r1.mf" = 0.025
"o4.qEst" = 0.01
# The fitted juvenile height (39) left the founding holly too slow to hold its place.
"r2.hJ" = 20

[rowan]
# The fit lowered Q_ss to 0.039, so rowan survived 5.4% (band 8–14%, the oak's score): back to M25's.
"r6.qMin" = 0.06

[pine]
# The fit lowered Q_ss to 0.096: pine survived 12.7%, as tolerant as birch (band 20–30%).
"r6.qMin" = 0.2
# The fit sees 100 seasons: with L_h 37 pine reached 39 m by season 150. L_h 30 gives 27.5 m at 100
# (table 29 m), 34.5 m at 150 and 37.4 m at 200, Scots pine's range.
"r1.Lh" = 30
