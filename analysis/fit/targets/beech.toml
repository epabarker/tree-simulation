# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
survivalLight = [0.01, 0.03]   # lowest light all seedlings survive (Kobe et al. 1995; Niinemets & Valladares 2006: 4.56)
