# M27 fit targets: European beech (Fagus sylvatica). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "beech"

[[trait]]
# Scale: 1 cell ≈ 0.25 m is uncertain by ±20% (traits note); the two shares are scale-free and
# carry the growth information.
name = "stand.height"
target = 84
band = 18
weight = 1
kind = "measured"
source = "dominant height ≈ 20–22 m at 60 years, site index ≈ 27–33 m at 100 (beech site-index curves: Nord-Larsen et al. 2009; Bončina et al. 2021; Stajić et al. 2021)"

[[trait]]
# Lone against stand: a lone tree scored against yield-table top heights (closed stands): assumes
# open-grown trees follow a similar curve, though open-grown height curves run lower and flatter
# (audit §1.4).
name = "lone.earlyShare"
target = 0.5
band = 0.08
weight = 1
kind = "measured"
source = "height at 30 over height at 60: beech grows slowly when young, its height increment culminating late (Stajić et al. 2021; Matisons et al. 2018)"

[[trait]]
name = "lone.spread"
target = 0.6
band = 0.2
weight = 0.5
kind = "described"
source = "open-grown W/H at about 60 years and 0.5 m DBH: Hemery et al. 2005 (read second-hand, with the sim's lone height) 0.35–0.38; Pretzsch et al. 2015's envelope 0.51–0.52 (with the sim's height); parkland trees of 120+ years reach 0.9–1.3. (Round 3's 0.9 cited Hein et al. 2008, which is open-grown ash and sycamore, Hein & Spiecker 2008, Agroforestry Systems 73:205.) The band's top, 0.8, leaves room for the wider reading. W/H is read against the sim's own lone height: a lone beech at 100 cells (25 m) at 60 is tall for an open-grown tree, so the lower edge is not pushed down further. The lone tree's spread at 100 (unfitted) is the parkland check on the panel"

[[trait]]
# Replaces lone.widestAt and lone.crownFullness (round 4): one vector a tiered crown
# cannot satisfy, each band ±0.1, the ten sharing the trait's weight.
name = "lone.profile"
profile = [0.33, 0.76, 0.95, 1, 1, 0.98, 0.93, 0.8, 0.58, 0.23]
band = 0.1
weight = 0.5
kind = "described"
source = "the crown's width in ten bands, base to top, over its widest: widest at 0.4 of the crown, as full as 0.75 (1 − |u|^q, q = p/(1 − p); the round-4 plan, step C.5). A broad dome, widest in its lower middle, not at the base (M26 note); a full, rounded dome (an ellipse is 0.79)"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 1
kind = "measured"
source = "open-grown H/D 51, 48, 47 at d 25, 40, 50 cm (Pretzsch et al. 2015 (UFUG 14:466), computed from its 95%-quantile crown radius and 5%-quantile height on mostly forest-plot trees: an envelope, not a solitary tree's mean); agrees with the generic 40–55 (MacFarlane et al. 2017), so measured"

[[trait]]
# Stand density: read in the closed stand at spacing 21 ≈ 5.25 m, ≈ 360 stems/ha: sparser than a
# yield-table stand at 60 (420–1000/ha), which lowers H/D and raises crown ratio against the
# tables (audit §1.4).
name = "stand.slenderness"
target = 82
band = 12
weight = 1
kind = "measured"
source = "stand H/D at 60, yield classes 0–1: 78–83 by top height over Weise's diameter, 107–108 for the mean tree (NW-FVA yield tables, Albert et al. 2021, the et.nwfva data); 59–82 at 100, 68 in 100-year stands (Hagemeier & Leuschner 2019)"

[[trait]]
# The crown's share of the height to its base by limbs: where the first-order limbs, from the
# bottom up, first hold 5% of the leaf area (metrics' limbCrownRatio, cli/trials.ts): the field's
# live crown base (round 4, ADR 0028).
name = "stand.crownRatio"
target = 0.57
band = 0.08
weight = 1
kind = "measured"
source = "stand crown ratio 0.66, 0.63, 0.60 at h 20, 25, 30 m (Pretzsch 2019 (Forests 10:810), Table 1 model 3: crown base against height at the 25% quantile in monocultures (the lowest live branch), CR computed at h 20–30 m); the median crown is ≈ 0.05 shorter than the 25% quantile's"

[[trait]]
# Leaf area index over the closed stand's ring at 60 (cli/trials.ts): leaf area per cell of
# ground.
name = "stand.lai"
target = 8.4
band = 1.5
weight = 1
kind = "measured"
source = "stand LAI 8.4 (K_PAR 0.51; Hagemeier & Leuschner 2019 (Forests 10:925), Table 5: litter-trap LAI, mean of two stands); litter-trap maxima of 4.5–5.1 in Czech beech (Černý et al. 2020) show the method's spread. The floor it implies, ≈ 1.4%, is held out"

[[trait]]
name = "lone.forkHeight"
target = 0.7
band = 0.2
weight = 0.5
kind = "described"
source = "Troll's model: a leader that keeps its lead, open-grown trunks often dividing into a few big limbs"

[[trait]]
name = "lone.leaderDominance"
target = 2.0
band = 0.8
weight = 0.5
kind = "described"
source = "moderate apical control"

[[trait]]
name = "lone.branchAngle"
target = 55
band = 10
weight = 0.5
kind = "described"
source = "ascending to spreading limbs, flatter where competition is low (Bayer et al. 2013)"

[[trait]]
name = "lone.limbDroop"
target = 10
band = 10
weight = 0.25
kind = "described"
source = "level limbs that arch a little at the tips"

[[trait]]
# Scale-free: the ratio carries the growth curve whatever the cell's size.
name = "stand.lateShare"
target = 1.43
band = 0.06
weight = 1
kind = "measured"
source = "stand height at 100 over height at 60: 1.41–1.45 for beech classes 1–2 (NW-FVA yield tables, Albert et al. 2021)"

[[trait]]
name = "shade.survivalLight"
target = 0.034
band = 0.01
weight = 1
kind = "measured"
source = "lowest light the seedling survives: beech saplings need 3.4% of PAR (Hagemeier & Leuschner 2019); fitted, not held out (ADR 0020 addendum)"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale. L_h spans 10–200 for
# every species: the hyperbolic discount needs larger values than the exponential (ADR 0021).
# r2.hJ is the juvenile height (ADR 0022): shoots lengthen as the tree grows to it.
[[param]]
path = "c3.alpha"
lo = 2.5
hi = 6
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 25
hi = 70
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"   # ADR 0027's 3D units: the 2D bounds 0.015–0.05 ÷ 8
lo = 0.001875
hi = 0.00625
[[param]]
path = "r1.Lh"
lo = 10
hi = 200
log = true
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3
[[param]]
path = "r2.hJ"
lo = 2
hi = 150
log = true

# Assignments every candidate carries unchanged (analysis/treesim/fit.py).
[fixed]
"r1.hydraulic" = "hyperbolic"   # 1/(1 + L_path/L_h): height keeps rising slowly (ADR 0021)

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
# The floor of the species' own wood planted per area at τ 0, at season 100 (m27_holdout.py): the
# one-row stand trial lights its floor through the empty depth beside the row (species plan §0.3).
floor = { target = 0.015, band = 0.008, kind = "measured", source = "beech canopies transmit a median 1.3% of PAR, 0.9–2.1% in 100–150-year stands (Hagemeier & Leuschner 2019 (overcast, diffuse PAR)); all-day values run higher (4.2%, Dobrowolska 2008)" }
survivalLight = [0.025, 0.045]   # lowest light all seedlings survive (Hagemeier & Leuschner 2019: beech saplings need 3.4%)
shadeScore = 4.56   # Niinemets & Valladares 2006, Appendix A
