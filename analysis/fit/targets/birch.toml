# M27 fit targets: silver birch (Betula pendula). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "birch"

[[trait]]
# Scale: 1 cell ≈ 0.25 m is uncertain by ±20% (traits note); the two shares are scale-free and
# carry the growth information.
name = "stand.height"
target = 95
band = 20
weight = 1
kind = "measured"
source = "dominant height ≈ 22–26 m at 60 years on fertile sites (birch yield tables and site-index curves: Lee et al. 2024; Jansen et al. 2018)"

[[trait]]
# Lone against stand: a lone tree scored against yield-table top heights (closed stands): assumes
# open-grown trees follow a similar curve, though open-grown height curves run lower and flatter
# (audit §1.4).
name = "lone.earlyShare"
target = 0.72
band = 0.08
weight = 1
kind = "measured"
source = "height at 30 over height at 60: birch's height growth culminates early (site-index curve shape; Zeoli et al. 2025)"

[[trait]]
name = "lone.spread"
target = 0.55
band = 0.12
weight = 0.5
kind = "described"
source = "open-grown W/H 0.52, 0.55, 0.56 at d 25, 40, 50 cm (Pretzsch et al. 2015 (UFUG 14:466), computed from its 95%-quantile crown radius and 5%-quantile height on mostly forest-plot trees: an envelope, not a solitary tree's mean, a lower bound); a narrow crown"

[[trait]]
# Replaces lone.widestAt and lone.crownFullness (round 4): one vector a tiered crown
# cannot satisfy, each band ±0.1, the ten sharing the trait's weight.
name = "lone.profile"
profile = [0.27, 0.67, 0.9, 1, 1, 0.96, 0.87, 0.72, 0.49, 0.18]
band = 0.1
weight = 0.5
kind = "described"
source = "the crown's width in ten bands, base to top, over its widest: widest at 0.4 of the crown, as full as 0.7 (1 − |u|^q, q = p/(1 − p); the round-4 plan, step C.5). An ovoid crown, widest below the middle (field guides); an ovoid outline (an ellipse is 0.79), not an hourglass (M26 note)"

[[trait]]
name = "lone.slenderness"
target = 40
band = 8
weight = 0.5
kind = "described"
source = "open-grown H/D 47, 38, 34 at d 25, 40, 50 cm (Pretzsch et al. 2015 (UFUG 14:466), computed from its 95%-quantile crown radius and 5%-quantile height on mostly forest-plot trees: an envelope, not a solitary tree's mean; n 26, d ≤ 39 cm); the generic 40–55 (MacFarlane et al. 2017) above it. Half weight"

[[trait]]
# Stand density: read in the closed stand at spacing 21 ≈ 5.25 m, ≈ 360 stems/ha: sparser than a
# yield-table stand at 60 (420–1000/ha), which lowers H/D and raises crown ratio against the
# tables (audit §1.4).
name = "stand.slenderness"
target = 95
band = 12
weight = 1
kind = "measured"
source = "stand H/D 105 at 45 years and 100 at 67 (Hagemeier & Leuschner 2019 Table 2, mean height over mean dbh); ≈ 100 in Moravian birch stands (Martiník & Mauer 2012, J. For. Sci. 58:181); birch stands are slender, H/D 80–110"

[[trait]]
# The crown's share of the height to its base by limbs: where the first-order limbs, from the
# bottom up, first hold 5% of the leaf area (metrics' limbCrownRatio, cli/trials.ts): the field's
# live crown base (round 4, ADR 0028).
name = "stand.crownRatio"
target = 0.38
band = 0.1
weight = 0.5
kind = "described"
source = "light-demanding species lift their crowns fast in stands (Kothari et al. 2025; M19 note)"

[[trait]]
# Leaf area index over the closed stand's ring at 60 (cli/trials.ts): leaf area per cell of
# ground.
name = "stand.lai"
target = 4.6
band = 1.5
weight = 1
kind = "measured"
source = "stand LAI 4.6 (K_PAR 0.37; Hagemeier & Leuschner 2019 (Forests 10:925), Table 5: litter-trap LAI, mean of two stands); the floor it implies, exp(−K·LAI) ≈ 18%, is held out (the model's effective extinction through the slab is lower: the C2 question after round 4)"

[[trait]]
name = "lone.forkHeight"
target = 0.9
band = 0.1
weight = 0.5
kind = "described"
source = "excurrent: one stem to the top (§9 'birch-like pioneer')"

[[trait]]
name = "lone.leaderDominance"
target = 3.0
band = 1.0
weight = 0.5
kind = "described"
source = "strong apical control while young (§9)"

[[trait]]
name = "lone.branchAngle"
target = 45
band = 10
weight = 0.5
kind = "described"
source = "fine, ascending first-order branches (§9; Yun et al. 2025 on angle and light demand)"

[[trait]]
name = "lone.limbDroop"
target = 15
band = 10
weight = 0.25
kind = "described"
source = "limbs arch, twigs hang (Betula pendula)"

[[trait]]
# Scale-free: the ratio carries the growth curve whatever the cell's size.
name = "stand.lateShare"
target = 1.12
band = 0.08
weight = 0.5
kind = "described"
source = "stand height at 100 over height at 60: birch's height growth culminates early and it is short-lived (site-index curve shape, Zeoli et al. 2025); an estimate"

[[trait]]
name = "shade.survivalLight"
target = 0.21
band = 0.05
weight = 1
kind = "measured"
source = "lowest light the seedling survives: birch saplings need 21% of PAR (Hagemeier & Leuschner 2019); fitted, not held out (ADR 0020 addendum)"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale. L_h spans 10–200 for
# every species: the hyperbolic discount needs larger values than the exponential (ADR 0021).
# r2.hJ is the juvenile height (ADR 0022): shoots lengthen as the tree grows to it.
[[param]]
path = "c3.alpha"
lo = 2.5
hi = 6
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 25
hi = 70
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"   # ADR 0027's 3D units: the 2D bounds 0.015–0.05 ÷ 8; the top doubled for birch
lo = 0.001875     # alone (2026-10-31): its 2D fit was near the old top, and round 3 ended on it
hi = 0.0125
[[param]]
path = "r1.Lh"
lo = 10
hi = 200
log = true
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3
[[param]]
path = "r2.hJ"
lo = 2
hi = 150
log = true

# Assignments every candidate carries unchanged (analysis/treesim/fit.py).
[fixed]
"r1.hydraulic" = "hyperbolic"   # 1/(1 + L_path/L_h): height keeps rising slowly (ADR 0021)

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
# The floor of the species' own wood planted per area at τ 0, at season 100 (m27_holdout.py): the
# one-row stand trial lights its floor through the empty depth beside the row (species plan §0.3).
floor = { target = 0.15, band = 0.05, kind = "measured", source = "birch canopies transmit a median 14.8% of PAR (6.4–19.8%; Hagemeier & Leuschner 2019 (overcast, diffuse PAR))" }
survivalLight = [0.15, 0.25]   # lowest light all seedlings survive (Hagemeier & Leuschner 2019: birch saplings need 21%; Kobe et al. 1995)
shadeScore = 2.03   # Niinemets & Valladares 2006, Appendix A
