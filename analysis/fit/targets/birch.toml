# M27 fit targets: silver birch (Betula pendula). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "birch"

[[trait]]
name = "stand.height"
target = 95
band = 20
weight = 1
kind = "measured"
source = "dominant height ≈ 22–26 m at 60 years on fertile sites (birch yield tables and site-index curves: Lee et al. 2024; Jansen et al. 2018)"

[[trait]]
name = "lone.earlyShare"
target = 0.72
band = 0.08
weight = 1
kind = "measured"
source = "height at 30 over height at 60: birch's height growth culminates early (site-index curve shape; Zeoli et al. 2025)"

[[trait]]
name = "lone.spread"
target = 0.45
band = 0.12
weight = 0.5
kind = "described"
source = "a narrow, open crown (M19 note; field guides)"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 1
kind = "measured"
source = "open-grown trees are squat, H/D ≈ 40–55 (MacFarlane et al. 2017)"

[[trait]]
name = "stand.slenderness"
target = 70
band = 10
weight = 1
kind = "measured"
source = "stand-grown H/D 60–80 (Watt et al. 2023)"

[[trait]]
name = "stand.crownRatio"
target = 0.38
band = 0.1
weight = 0.5
kind = "described"
source = "light-demanding species lift their crowns fast in stands (Kothari et al. 2025; M19 note)"

[[trait]]
name = "stand.floor"
target = 0.15
band = 0.05
weight = 1
kind = "measured"
source = "birch canopies transmit a median 14.8% of PAR (6.4–19.8%; Hagemeier & Leuschner 2019 (overcast, diffuse PAR))"

[[trait]]
name = "lone.widestAt"
target = 0.4
band = 0.15
weight = 0.5
kind = "described"
source = "an ovoid crown, widest below the middle (field guides)"

[[trait]]
name = "lone.crownFullness"
target = 0.7
band = 0.1
weight = 0.5
kind = "described"
source = "an ovoid outline (an ellipse is 0.79), not an hourglass (M26 note)"

[[trait]]
name = "lone.forkHeight"
target = 0.9
band = 0.1
weight = 0.5
kind = "described"
source = "excurrent: one stem to the top (§9 'birch-like pioneer')"

[[trait]]
name = "lone.leaderDominance"
target = 3.0
band = 1.0
weight = 0.5
kind = "described"
source = "strong apical control while young (§9)"

[[trait]]
name = "lone.branchAngle"
target = 45
band = 10
weight = 0.5
kind = "described"
source = "fine, ascending first-order branches (§9; Yun et al. 2025 on angle and light demand)"

[[trait]]
name = "lone.limbDroop"
target = 15
band = 10
weight = 0.25
kind = "described"
source = "limbs arch, twigs hang (Betula pendula)"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale.
[[param]]
