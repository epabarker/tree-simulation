# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
survivalLight = [0.15, 0.25]   # lowest light all seedlings survive (Hagemeier & Leuschner 2019: birch saplings need 21%; Kobe et al. 1995)
shadeScore = 2.03   # Niinemets & Valladares 2006, Appendix A
