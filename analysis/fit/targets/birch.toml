lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 25
hi = 70
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1.5
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"
lo = 0.015
hi = 0.05
[[param]]
path = "r1.Lh"
lo = 25
hi = 100
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
