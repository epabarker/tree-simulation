# M27 fit targets: silver fir (Abies alba). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "fir"

[[trait]]
name = "stand.height"
target = 80
band = 14
weight = 1
kind = "measured"
source = "silver fir top height 17.6–23.0 m at 60 years for site index 28–34 m (Tirol fir tables, 2004, from the Baden-Württemberg fir yield table)"

[[trait]]
name = "lone.earlyShare"
target = 0.42
band = 0.06
weight = 1
kind = "measured"
source = "height at 30 over height at 60: 0.35–0.47 for site index 28–38 m (Tirol fir tables, 2004): slow in youth"

[[trait]]
name = "lone.spread"
target = 0.4
band = 0.12
weight = 0.5
kind = "described"
source = "a narrow cone (field guides; M19 note)"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 1
kind = "measured"
source = "open-grown trees are squat, H/D ≈ 40–55 (MacFarlane et al. 2017)"

[[trait]]
name = "stand.slenderness"
target = 70
band = 10
weight = 1
kind = "measured"
source = "stand-grown H/D 60–80 (Watt et al. 2023)"

[[trait]]
name = "stand.crownRatio"
target = 0.6
band = 0.1
weight = 0.5
kind = "described"
source = "a shade-tolerant conifer keeps a deep crown in a stand, roughly 0.5–0.7 (M19 note)"

[[trait]]
name = "stand.floor"
target = 0.013
band = 0.008
weight = 0.5
kind = "described"
source = "1.3% (0.7–3.0%), estimated from Hagemeier & Leuschner 2019's five measured species: ln(floor %) = 4.92 − 1.08 × Niinemets & Valladares score, cross-checked by LAI and Beer–Lambert (user's research, analysis/fit/sources/floor_light_targets.csv)"

[[trait]]
name = "lone.widestAt"
target = 0.1
band = 0.1
weight = 0.5
kind = "described"
source = "a cone: widest at the base"

[[trait]]
name = "lone.crownFullness"
target = 0.55
band = 0.1
weight = 0.5
kind = "described"
source = "a triangle fills half its box (0.5); a cone a little more"

[[trait]]
name = "lone.forkHeight"
target = 0.92
band = 0.08
weight = 0.5
kind = "described"
source = "excurrent: one stem to the top (Massart's model, §9)"

[[trait]]
name = "lone.leaderDominance"
target = 4
band = 1.2
weight = 0.5
kind = "described"
source = "strong apical control: the leader far thicker than any limb in a whorl"

[[trait]]
name = "lone.branchAngle"
target = 75
band = 10
weight = 0.5
kind = "described"
source = "Massart's tiers: near-horizontal, plagiotropic branches (§9)"

[[trait]]
name = "lone.limbDroop"
target = 5
band = 10
weight = 0.25
kind = "described"
source = "level tiers"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale.
# Level 1's η stays at 1.5–2: Massart's flat tiers need the strong plagiotropic pull (M7).
[[param]]
path = "c3.alpha"
lo = 2.5
hi = 6
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 50
hi = 90
[[param]]
path = "r2.levels.1.eta"
lo = 1.5
hi = 2
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"
lo = 0.015
hi = 0.05
[[param]]
path = "r1.Lh"
lo = 25
hi = 100
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
survivalLight = [0.015, 0.04]   # lowest light all seedlings survive (beech's band: scored as tolerant as beech (4.6 against 4.56))
shadeScore = 4.6   # Niinemets & Valladares 2006, Appendix A
