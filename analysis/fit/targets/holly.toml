# M27 fit targets: holly (Ilex aquifolium). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "holly"

[[trait]]
# Scale: 1 cell ≈ 0.25 m is uncertain by ±20% (traits note); the two shares are scale-free and
# carry the growth information.
name = "stand.height"
target = 41
band = 12
weight = 0.5
kind = "described"
source = "≈ 10 m at 60 years on the same fitted curve (open or edge growth); field guides 10–15 m mature"

[[trait]]
# Lone against stand: a lone tree scored against yield-table top heights (closed stands): assumes
# open-grown trees follow a similar curve, though open-grown height curves run lower and flatter
# (audit §1.4).
name = "lone.earlyShare"
target = 0.63
band = 0.1
weight = 0.5
kind = "described"
source = "height at 30 over height at 60: 0.63 on a curve fitted through holly's maximum heights and a few dated trees (open or edge growth; Peterken & Lloyd 1967; waldwissen; Church 2016)"

[[trait]]
name = "lone.spread"
target = 0.5
band = 0.15
weight = 0.5
kind = "described"
source = "a narrow cone (field guides; M25)"

[[trait]]
# Replaces lone.widestAt and lone.crownFullness (round 4): one vector a tiered crown
# cannot satisfy, each band ±0.1, the ten sharing the trait's weight.
name = "lone.profile"
profile = [0.39, 1, 0.93, 0.83, 0.72, 0.6, 0.48, 0.35, 0.21, 0.07]
band = 0.1
weight = 0.5
kind = "described"
source = "the crown's width in ten bands, base to top, over its widest: widest at 0.15 of the crown, as full as 0.55 (1 − |u|^q, q = p/(1 − p); the round-4 plan, step C.5). A cone: widest near the base; a cone fills a little over half its box (a triangle is 0.5)"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 0.5
kind = "described"
source = "open-grown trees are squat, H/D ≈ 40–55 (MacFarlane et al. 2017): a generic range, no species number found; half weight"

[[trait]]
# Stand density: read in the closed stand at spacing 21 ≈ 5.25 m, ≈ 360 stems/ha: sparser than a
# yield-table stand at 60 (420–1000/ha), which lowers H/D and raises crown ratio against the
# tables (audit §1.4).
name = "stand.slenderness"
target = 70
band = 10
weight = 0.5
kind = "described"
source = "no species-specific stand H/D found: the generic stand range 60–80 (Watt et al. 2023, conifer stands), half weight, so acceptance no longer rests on it"

[[trait]]
# The crown's share of the height to its base by limbs: where the first-order limbs, from the
# bottom up, first hold 5% of the leaf area (metrics' limbCrownRatio, cli/trials.ts): the field's
# live crown base (round 4, ADR 0028).
name = "stand.crownRatio"
target = 0.75
band = 0.1
weight = 0.5
kind = "described"
source = "keeps its shaded lower limbs: a crown most of the stem long (M25)"

[[trait]]
name = "lone.forkHeight"
target = 0.9
band = 0.1
weight = 0.5
kind = "described"
source = "excurrent: one stem to the top while young"

[[trait]]
name = "lone.leaderDominance"
target = 3
band = 1
weight = 0.5
kind = "described"
source = "strong apical control (M25)"

[[trait]]
name = "lone.branchAngle"
target = 60
band = 10
weight = 0.5
kind = "described"
source = "wide limbs on a cone (M25)"

[[trait]]
name = "lone.limbDroop"
target = 10
band = 10
weight = 0.25
kind = "described"
source = "lower limbs sweep down a little"

[[trait]]
# Scale-free: the ratio carries the growth curve whatever the cell's size.
name = "stand.lateShare"
target = 1.22
band = 0.1
weight = 0.5
kind = "described"
source = "stand height at 100 over height at 60: 1.22 on the fitted holly curve (open or edge growth)"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale. L_h spans 10–200 for
# every species: the hyperbolic discount needs larger values than the exponential (ADR 0021).
# r2.hJ is the juvenile height (ADR 0022): shoots lengthen as the tree grows to it.
# A small, slow tree: α may go lower; its limbs are wide.
[[param]]
path = "c3.alpha"
lo = 1.8
hi = 4.5
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 35
hi = 80
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"   # ADR 0027's 3D units: the 2D bounds 0.015–0.05 ÷ 8
lo = 0.001875
hi = 0.00625
[[param]]
path = "r1.Lh"
lo = 10
hi = 200
log = true
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3
[[param]]
path = "r2.hJ"
lo = 2
hi = 150
log = true

# Assignments every candidate carries unchanged (analysis/treesim/fit.py).
[fixed]
"r1.hydraulic" = "hyperbolic"   # 1/(1 + L_path/L_h): height keeps rising slowly (ADR 0021)

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
# The floor of the species' own wood planted per area at τ 0, at season 100 (m27_holdout.py): the
# one-row stand trial lights its floor through the empty depth beside the row (species plan §0.3).
floor = { target = 0.02, band = 0.01, kind = "described", source = "2% (1–3.5%), estimated from Hagemeier & Leuschner 2019's five measured species: ln(floor %) = 4.92 − 1.08 × Niinemets & Valladares score, cross-checked by LAI and Beer–Lambert (user's research, analysis/fit/sources/floor_light_targets.csv); set low in its range: an evergreen, dense crown" }
survivalLight = [0.02, 0.05]   # lowest light all seedlings survive (Valladares et al. 2005: high mortality at 1%)
shadeScore = 3.86   # Niinemets & Valladares 2006, Appendix A
