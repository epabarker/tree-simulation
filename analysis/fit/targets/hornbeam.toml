# M27 fit targets: hornbeam (Carpinus betulus). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "hornbeam"

[[trait]]
# Scale: 1 cell ≈ 0.25 m is uncertain by ±20% (traits note); the two shares are scale-free and
# carry the growth information.
name = "stand.height"
target = 84
band = 13
weight = 1
kind = "measured"
source = "Lockow & Lockow 2009 hornbeam yield table (NE German lowlands; stand age volume-weighted): top height 20.3–22.0 m at 60 years for site index 25–27 m"

[[trait]]
# Lone against stand: a lone tree scored against yield-table top heights (closed stands): assumes
# open-grown trees follow a similar curve, though open-grown height curves run lower and flatter
# (audit §1.4).
name = "lone.earlyShare"
target = 0.67
band = 0.05
weight = 1
kind = "measured"
source = "height at 30 over height at 60: 0.665–0.673 for site index 25–27 m, 0.60–0.68 over all classes (Lockow & Lockow 2009 hornbeam yield table (NE German lowlands; stand age volume-weighted))"

[[trait]]
name = "lone.spread"
target = 0.7
band = 0.2
weight = 0.5
kind = "described"
source = "open-grown W/H at about 60 years: 0.57, 0.53 at d 25, 40 cm (Pretzsch et al. 2015 (UFUG 14:466), computed from its 95%-quantile crown radius and 5%-quantile height on mostly forest-plot trees: an envelope, not a solitary tree's mean, a lower bound); a broad dome in parkland at twice the age. Re-centred at the trial's age as beech and oak (round 4)"

[[trait]]
# Replaces lone.widestAt and lone.crownFullness (round 4): one vector a tiered crown
# cannot satisfy, each band ±0.1, the ten sharing the trait's weight.
name = "lone.profile"
profile = [0.26, 0.65, 0.88, 0.98, 1, 0.99, 0.93, 0.79, 0.56, 0.22]
band = 0.1
weight = 0.5
kind = "described"
source = "the crown's width in ten bands, base to top, over its widest: widest at 0.45 of the crown, as full as 0.72 (1 − |u|^q, q = p/(1 − p); the round-4 plan, step C.5). A rounded crown, widest about its middle; a full, rounded crown (an ellipse is 0.79)"

[[trait]]
name = "lone.slenderness"
target = 58
band = 10
weight = 0.5
kind = "described"
source = "H/D 68, 60, 56 at d 25, 40, 50 cm (Pretzsch et al. 2015 (UFUG 14:466), computed from its 95%-quantile crown radius and 5%-quantile height on mostly forest-plot trees: an envelope, not a solitary tree's mean; forest-plot trees, so taller than open-grown ones): half weight"

[[trait]]
# Stand density: read in the closed stand at spacing 21 ≈ 5.25 m, ≈ 360 stems/ha: sparser than a
# yield-table stand at 60 (420–1000/ha), which lowers H/D and raises crown ratio against the
# tables (audit §1.4).
name = "stand.slenderness"
target = 86
band = 12
weight = 1
kind = "measured"
source = "stand H/D at 60, site index 25–27: 84–87 by top height over top diameter, 106–113 for the mean tree (Lockow & Lockow 2009, analysis/fit/sources/hornbeam_yield_table_lockow2009.csv); 81–93 in 95–116-year stands (Hagemeier & Leuschner 2019)"

[[trait]]
# The crown's share of the height to its base by limbs: where the first-order limbs, from the
# bottom up, first hold 5% of the leaf area (metrics' limbCrownRatio, cli/trials.ts): the field's
# live crown base (round 4, ADR 0028).
name = "stand.crownRatio"
target = 0.55
band = 0.1
weight = 0.5
kind = "described"
source = "shade-tolerant species keep deep crowns in stands (Kothari et al. 2025)"

[[trait]]
# Leaf area index over the closed stand's ring at 60 (cli/trials.ts): leaf area per cell of
# ground.
name = "stand.lai"
target = 8.3
band = 1.5
weight = 1
kind = "measured"
source = "stand LAI 8.3 (K_PAR 0.51; Hagemeier & Leuschner 2019 (Forests 10:925), Table 5: litter-trap LAI, mean of two stands; stands 68–77% hornbeam); the floor it implies, ≈ 1.5%, is held out"

[[trait]]
name = "lone.forkHeight"
target = 0.4
band = 0.2
weight = 0.5
kind = "described"
source = "rounded and forking low: open-grown trunks divide into several stems"

[[trait]]
name = "lone.leaderDominance"
target = 1.6
band = 0.6
weight = 0.5
kind = "described"
source = "weaker apical control than beech (M25)"

[[trait]]
name = "lone.branchAngle"
target = 50
band = 10
weight = 0.5
kind = "described"
source = "fine, ascending limbs (field guides)"

[[trait]]
name = "lone.limbDroop"
target = 10
band = 10
weight = 0.25
kind = "described"
source = "limbs that arch a little at the tips"

[[trait]]
# Scale-free: the ratio carries the growth curve whatever the cell's size.
name = "stand.lateShare"
target = 1.23
band = 0.05
weight = 1
kind = "measured"
source = "stand height at 100 over height at 60: 1.23 for site index 25–27 (Lockow & Lockow 2009)"

[[trait]]
name = "shade.survivalLight"
target = 0.033
band = 0.01
weight = 1
kind = "measured"
source = "lowest light the seedling survives: hornbeam saplings need 3.3% of PAR (Hagemeier & Leuschner 2019); fitted, not held out (ADR 0020 addendum)"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale. L_h spans 10–200 for
# every species: the hyperbolic discount needs larger values than the exponential (ADR 0021).
# r2.hJ is the juvenile height (ADR 0022): shoots lengthen as the tree grows to it.
[[param]]
path = "c3.alpha"
lo = 2.5
hi = 6
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 25
hi = 70
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"   # ADR 0027's 3D units: the 2D bounds 0.015–0.05 ÷ 8
lo = 0.001875
hi = 0.00625
[[param]]
path = "r1.Lh"
lo = 10
hi = 200
log = true
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3
[[param]]
path = "r2.hJ"
lo = 2
hi = 150
log = true

# Assignments every candidate carries unchanged (analysis/treesim/fit.py).
[fixed]
"r1.hydraulic" = "hyperbolic"   # 1/(1 + L_path/L_h): height keeps rising slowly (ADR 0021)

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
# The floor of the species' own wood planted per area at τ 0, at season 100 (m27_holdout.py): the
# one-row stand trial lights its floor through the empty depth beside the row (species plan §0.3).
floor = { target = 0.015, band = 0.008, kind = "measured", source = "hornbeam canopies transmit a median 1.3% of PAR; hornbeam, lime and beech together 0.6–2.8% (Hagemeier & Leuschner 2019 (overcast, diffuse PAR))" }
survivalLight = [0.025, 0.045]   # lowest light all seedlings survive (Hagemeier & Leuschner 2019: hornbeam saplings need 3.3%)
shadeScore = 3.97   # Niinemets & Valladares 2006, Appendix A
