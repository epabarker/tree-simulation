# M27 fit targets: hornbeam (Carpinus betulus). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "hornbeam"

[[trait]]
name = "stand.height"
target = 84
band = 13
weight = 1
kind = "measured"
source = "Lockow & Lockow 2009 hornbeam yield table (NE German lowlands; stand age volume-weighted): top height 20.3–22.0 m at 60 years for site index 25–27 m"

[[trait]]
name = "lone.earlyShare"
target = 0.67
band = 0.05
weight = 1
kind = "measured"
source = "height at 30 over height at 60: 0.665–0.673 for site index 25–27 m, 0.60–0.68 over all classes (Lockow & Lockow 2009 hornbeam yield table (NE German lowlands; stand age volume-weighted))"

[[trait]]
name = "lone.spread"
target = 1
band = 0.25
weight = 0.5
kind = "described"
source = "a rounded crown about as wide as it is tall, open-grown (field guides)"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 1
kind = "measured"
source = "open-grown trees are squat, H/D ≈ 40–55 (MacFarlane et al. 2017)"

[[trait]]
name = "stand.slenderness"
target = 70
band = 10
weight = 1
kind = "measured"
source = "stand-grown H/D 60–80 (Watt et al. 2023)"

[[trait]]
name = "stand.crownRatio"
target = 0.55
band = 0.1
weight = 0.5
kind = "described"
source = "shade-tolerant species keep deep crowns in stands (Kothari et al. 2025)"

[[trait]]
name = "stand.floor"
target = 0.015
band = 0.008
weight = 1
kind = "measured"
source = "hornbeam canopies transmit a median 1.3% of PAR; hornbeam, lime and beech together 0.6–2.8% (Hagemeier & Leuschner 2019 (overcast, diffuse PAR))"

[[trait]]
name = "lone.widestAt"
target = 0.45
band = 0.15
weight = 0.5
kind = "described"
source = "a rounded crown, widest about its middle"

[[trait]]
name = "lone.crownFullness"
target = 0.72
band = 0.1
weight = 0.5
kind = "described"
source = "a full, rounded crown (an ellipse is 0.79)"

[[trait]]
name = "lone.forkHeight"
target = 0.4
band = 0.2
weight = 0.5
kind = "described"
source = "rounded and forking low: open-grown trunks divide into several stems"

[[trait]]
name = "lone.leaderDominance"
target = 1.6
band = 0.6
weight = 0.5
kind = "described"
source = "weaker apical control than beech (M25)"

[[trait]]
name = "lone.branchAngle"
target = 50
band = 10
weight = 0.5
kind = "described"
source = "fine, ascending limbs (field guides)"

[[trait]]
name = "lone.limbDroop"
target = 10
band = 10
weight = 0.25
kind = "described"
source = "limbs that arch a little at the tips"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale.
[[param]]
path = "c3.alpha"
lo = 2.5
hi = 6
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 25
hi = 70
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1.5
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"
lo = 0.015
hi = 0.05
[[param]]
path = "r1.Lh"
lo = 25
hi = 100
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
survivalLight = [0.025, 0.045]   # lowest light all seedlings survive (Hagemeier & Leuschner 2019: hornbeam saplings need 3.3%)
shadeScore = 3.97   # Niinemets & Valladares 2006, Appendix A
