# M27 fit targets: field maple (Acer campestre). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "maple"

[[trait]]
# Scale: 1 cell ≈ 0.25 m is uncertain by ±20% (traits note); the two shares are scale-free and
# carry the growth information.
name = "stand.height"
target = 64
band = 11
weight = 1
kind = "measured"
source = "German national forest inventory (BWI 2012, 782 trees): mean height 16.1 m at mean age 63 (Bavarian LWF report, LWF Wissen 77)"

[[trait]]
# Lone against stand: a lone tree scored against yield-table top heights (closed stands): assumes
# open-grown trees follow a similar curve, though open-grown height curves run lower and flatter
# (audit §1.4).
name = "lone.earlyShare"
target = 0.7
band = 0.08
weight = 0.5
kind = "described"
source = "height at 30 over height at 60: maples grow fast young and lose growth early; height growth largely done by about 25 years (EUFORGEN Austria; waldwissen.net)"

[[trait]]
name = "lone.spread"
target = 0.7
band = 0.2
weight = 0.5
kind = "described"
source = "open-grown W/H at about 60 years, by proxy: sycamore 0.40 (Pretzsch et al. 2015's envelope, a lower bound), urban sycamore 0.55 and Norway maple 0.65 (Franceschi et al. 2022 Table 1 means); field maple itself not found. Re-centred at the trial's age as hornbeam (round 4)"

[[trait]]
# Replaces lone.widestAt and lone.crownFullness (round 4): one vector a tiered crown
# cannot satisfy, each band ±0.1, the ten sharing the trait's weight.
name = "lone.profile"
profile = [0.26, 0.65, 0.88, 0.98, 1, 0.99, 0.93, 0.79, 0.56, 0.22]
band = 0.1
weight = 0.5
kind = "described"
source = "the crown's width in ten bands, base to top, over its widest: widest at 0.45 of the crown, as full as 0.72 (1 − |u|^q, q = p/(1 − p); the round-4 plan, step C.5). Norway maple, the nearest species classified, is spherical (44%) or ovoid (38%) (Franceschi et al. 2022 Table 5): widest near the middle"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 0.5
kind = "described"
source = "open-grown trees are squat, H/D ≈ 40–55 (MacFarlane et al. 2017): a generic range, no species number found; half weight. Proxies: sycamore 57–52 at d 40–50 cm (Pretzsch et al. 2015's envelope), urban sycamore 41 (Franceschi et al. 2022)"

[[trait]]
# Stand density: read in the closed stand at spacing 21 ≈ 5.25 m, ≈ 360 stems/ha: sparser than a
# yield-table stand at 60 (420–1000/ha), which lowers H/D and raises crown ratio against the
# tables (audit §1.4).
name = "stand.slenderness"
target = 68
band = 12
weight = 0.5
kind = "measured"
source = "field maple H/D 65 in the German national inventory (BWI 2012 mean: d 24.7 cm, h 16.1 m, age 63) and 64–73 for canopy maples in mixed stands (Klemmt et al. 2015, LWF Wissen 77, Tables 1 and 3): an inventory mix of positions, half weight"

[[trait]]
# The crown's share of the height to its base by limbs: where the first-order limbs, from the
# bottom up, first hold 5% of the leaf area (metrics' limbCrownRatio, cli/trials.ts): the field's
# live crown base (round 4, ADR 0028).
name = "stand.crownRatio"
target = 0.5
band = 0.1
weight = 0.5
kind = "described"
source = "mid-tolerant: a crown between birch's and beech's in depth (Kothari et al. 2025)"

[[trait]]
# Leaf area index over the closed stand's ring at 60 (cli/trials.ts): leaf area per cell of
# ground.
name = "stand.lai"
target = 4
band = 1.5
weight = 0.5
kind = "described"
source = "a sycamore stand's maximum LAI 4.0 (Černý et al. 2020, J. For. Res. 31:827, read from the abstract): a proxy species and one stand, half weight. Field maple not found"

[[trait]]
name = "lone.forkHeight"
target = 0.35
band = 0.2
weight = 0.5
kind = "described"
source = "rounded and forking low: decurrent (M25)"

[[trait]]
name = "lone.leaderDominance"
target = 1.6
band = 0.6
weight = 0.5
kind = "described"
source = "weak apical control once the crown forms"

[[trait]]
name = "lone.branchAngle"
target = 45
band = 10
weight = 0.5
kind = "described"
source = "ascending limbs on stiff wood (M25)"

[[trait]]
name = "lone.limbDroop"
target = 10
band = 10
weight = 0.25
kind = "described"
source = "limbs that arch a little at the tips"

[[trait]]
# Scale-free: the ratio carries the growth curve whatever the cell's size.
name = "stand.lateShare"
target = 1.3
band = 0.1
weight = 0.5
kind = "described"
source = "stand height at 100 over height at 60: canopy maples reach 24.6–26.4 m at 88–102 years against a mean of 16.1 m at 63 across the inventory (LWF Wissen 77); an estimate"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale. L_h spans 10–200 for
# every species: the hyperbolic discount needs larger values than the exponential (ADR 0021).
# r2.hJ is the juvenile height (ADR 0022): shoots lengthen as the tree grows to it.
[[param]]
path = "c3.alpha"
lo = 2.5
hi = 6
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 25
hi = 70
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"   # ADR 0027's 3D units: the 2D bounds 0.015–0.05 ÷ 8
lo = 0.001875
hi = 0.00625
[[param]]
path = "r1.Lh"
lo = 10
hi = 200
log = true
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3
[[param]]
path = "r2.hJ"
lo = 2
hi = 150
log = true

# Assignments every candidate carries unchanged (analysis/treesim/fit.py).
[fixed]
"r1.hydraulic" = "hyperbolic"   # 1/(1 + L_path/L_h): height keeps rising slowly (ADR 0021)

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
# The floor of the species' own wood planted per area at τ 0, at season 100 (m27_holdout.py): the
# one-row stand trial lights its floor through the empty depth beside the row (species plan §0.3).
floor = { target = 0.045, band = 0.02, kind = "described", source = "4.5% (2.5–8%), estimated from Hagemeier & Leuschner 2019's five measured species: ln(floor %) = 4.92 − 1.08 × Niinemets & Valladares score, cross-checked by LAI and Beer–Lambert (user's research, analysis/fit/sources/floor_light_targets.csv)" }
survivalLight = [0.05, 0.1]   # lowest light all seedlings survive (saplings estimated to need 8% (score regression, floor_light_targets.csv))
shadeScore = 3.18   # Niinemets & Valladares 2006, Appendix A
