# M27 fit targets: pedunculate oak (Quercus robur). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "oak"

[[trait]]
# Scale: 1 cell ≈ 0.25 m is uncertain by ±20% (traits note); the two shares are scale-free and
# carry the growth information.
name = "stand.height"
target = 78
band = 13
weight = 1
kind = "measured"
source = "NW-FVA yield tables (Albert et al. 2021, after Schober), oak yield classes 1–2: top height 18.1–21.0 m at 60 years"

[[trait]]
# Lone against stand: a lone tree scored against yield-table top heights (closed stands): assumes
# open-grown trees follow a similar curve, though open-grown height curves run lower and flatter
# (audit §1.4).
name = "lone.earlyShare"
target = 0.62
band = 0.05
weight = 1
kind = "measured"
source = "height at 30 over height at 60: 0.59–0.65 over oak yield classes −1 to 2 (NW-FVA yield tables (Albert et al. 2021, after Schober))"

[[trait]]
name = "lone.spread"
target = 0.75
band = 0.25
weight = 0.5
kind = "described"
source = "open-grown W/H at about 60 years and 0.5 m DBH: Hemery et al. 2005 (read second-hand, with the sim's lone height) 0.43; Pretzsch et al. 2015's envelope 0.52; parkland oaks broader than tall are trees of DBH 1 m and more (120+ years). The band's top, 1.0, leaves room for the wider reading; W/H is read against the sim's own lone height. The lone tree's spread at 100 (unfitted) is the parkland check on the panel"

[[trait]]
# Replaces lone.widestAt and lone.crownFullness (round 4): one vector a tiered crown
# cannot satisfy, each band ±0.1, the ten sharing the trait's weight.
name = "lone.profile"
profile = [0.24, 0.6, 0.83, 0.96, 1, 1, 0.96, 0.83, 0.6, 0.24]
band = 0.1
weight = 0.5
kind = "described"
source = "the crown's width in ten bands, base to top, over its widest: widest at 0.5 of the crown, as full as 0.72 (1 − |u|^q, q = p/(1 − p); the round-4 plan, step C.5). A broad, rounded crown, widest about its middle; a rounded, full crown (an ellipse is 0.79)"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 0.5
kind = "described"
source = "open-grown trees are squat, H/D ≈ 40–55 (MacFarlane et al. 2017): a generic range, no species number found; half weight. Pretzsch et al. 2015's Q. robur height relation (≈ 6 m at d 25 cm) is unusable"

[[trait]]
# Stand density: read in the closed stand at spacing 21 ≈ 5.25 m, ≈ 360 stems/ha: sparser than a
# yield-table stand at 60 (420–1000/ha), which lowers H/D and raises crown ratio against the
# tables (audit §1.4).
name = "stand.slenderness"
target = 75
band = 10
weight = 1
kind = "measured"
source = "stand H/D at 60, yield classes 1–2: 74–76 by top height over Weise's diameter, 85–88 for the mean tree (NW-FVA yield tables, Albert et al. 2021, the et.nwfva data); 59–70 at 100"

[[trait]]
# The crown's share of the height to its base by limbs: where the first-order limbs, from the
# bottom up, first hold 5% of the leaf area (metrics' limbCrownRatio, cli/trials.ts): the field's
# live crown base (round 4, ADR 0028).
name = "stand.crownRatio"
target = 0.42
band = 0.08
weight = 0.5
kind = "measured"
source = "sessile oak's stand crown ratio 0.47, 0.45, 0.44 at h 20, 25, 30 m (Pretzsch 2019 (Forests 10:810), Table 1 model 3: crown base against height at the 25% quantile in monocultures (the lowest live branch), CR computed at h 20–30 m), the median ≈ 0.05 shorter; sessile for pedunculate, half weight"

[[trait]]
# Leaf area index over the closed stand's ring at 60 (cli/trials.ts): leaf area per cell of
# ground.
name = "stand.lai"
target = 5.5
band = 1.5
weight = 1
kind = "measured"
source = "stand LAI 5.5 for sessile oak (K_PAR 0.48; Hagemeier & Leuschner 2019 (Forests 10:925), Table 5: litter-trap LAI, mean of two stands); the floor it implies, ≈ 7%, is held out"

[[trait]]
name = "lone.forkHeight"
target = 0.3
band = 0.15
weight = 0.5
kind = "described"
source = "decurrent: the trunk divides low into a few big limbs (§9; M26 note)"

[[trait]]
name = "lone.leaderDominance"
target = 1.3
band = 0.5
weight = 0.5
kind = "described"
source = "apical control fades early: no leader thicker than its limbs"

[[trait]]
name = "lone.branchAngle"
target = 55
band = 10
weight = 0.5
kind = "described"
source = "wide-angled, spreading limbs (§9; Plate II)"

[[trait]]
name = "lone.limbDroop"
target = 5
band = 10
weight = 0.25
kind = "described"
source = "stiff limbs that reach out level, twisting rather than arching"

[[trait]]
# Scale-free: the ratio carries the growth curve whatever the cell's size.
name = "stand.lateShare"
target = 1.31
band = 0.06
weight = 1
kind = "measured"
source = "stand height at 100 over height at 60: 1.29–1.33 for oak classes 1–2 (NW-FVA yield tables (Albert et al. 2021))"

[[trait]]
name = "shade.survivalLight"
target = 0.114
band = 0.03
weight = 1
kind = "measured"
source = "lowest light the seedling survives: sessile oak saplings need 11.4% of PAR (Hagemeier & Leuschner 2019); fitted, not held out (ADR 0020 addendum)"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale. L_h spans 10–200 for
# every species: the hyperbolic discount needs larger values than the exponential (ADR 0021).
# r2.hJ is the juvenile height (ADR 0022): shoots lengthen as the tree grows to it.
[[param]]
path = "c3.alpha"
lo = 2.5
hi = 6
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 25
hi = 70
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"   # ADR 0027's 3D units: the 2D bounds 0.015–0.05 ÷ 8
lo = 0.001875
hi = 0.00625
[[param]]
path = "r1.Lh"
lo = 10
hi = 200
log = true
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3
[[param]]
path = "r2.hJ"
lo = 2
hi = 150
log = true

# Assignments every candidate carries unchanged (analysis/treesim/fit.py).
[fixed]
"r1.hydraulic" = "hyperbolic"   # 1/(1 + L_path/L_h): height keeps rising slowly (ADR 0021)

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
# The floor of the species' own wood planted per area at τ 0, at season 100 (m27_holdout.py): the
# one-row stand trial lights its floor through the empty depth beside the row (species plan §0.3).
floor = { target = 0.084, band = 0.03, kind = "measured", source = "sessile oak canopies transmit a median 8.4% of PAR (4.9–12.8%; Hagemeier & Leuschner 2019 (overcast, diffuse PAR))" }
survivalLight = [0.08, 0.14]   # lowest light all seedlings survive (Hagemeier & Leuschner 2019: sessile oak saplings need 11.4%; Ligot et al. 2013)
shadeScore = 2.45   # Niinemets & Valladares 2006, Appendix A
