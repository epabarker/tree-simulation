# M27 fit targets: pedunculate oak (Quercus robur). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "oak"

[[trait]]
name = "stand.height"
target = 78
band = 13
weight = 1
kind = "measured"
source = "NW-FVA yield tables (Albert et al. 2021, after Schober), oak yield classes 1–2: top height 18.1–21.0 m at 60 years"

[[trait]]
name = "lone.earlyShare"
target = 0.62
band = 0.05
weight = 1
kind = "measured"
source = "height at 30 over height at 60: 0.59–0.65 over oak yield classes −1 to 2 (NW-FVA yield tables (Albert et al. 2021, after Schober))"

[[trait]]
name = "lone.spread"
target = 1.3
band = 0.3
weight = 0.5
kind = "described"
source = "an open-grown oak is as broad as it is tall or broader (Plate II; M19 note)"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 1
kind = "measured"
source = "open-grown trees are squat, H/D ≈ 40–55 (MacFarlane et al. 2017)"

[[trait]]
name = "stand.slenderness"
target = 70
band = 10
weight = 1
kind = "measured"
source = "stand-grown H/D 60–80 (Watt et al. 2023)"

[[trait]]
name = "stand.crownRatio"
target = 0.4
band = 0.1
weight = 0.5
kind = "described"
source = "a light-demander's crown lifts in a stand (Kothari et al. 2025; M19 note)"

[[trait]]
name = "stand.floor"
target = 0.084
band = 0.03
weight = 1
kind = "measured"
source = "sessile oak canopies transmit a median 8.4% of PAR (4.9–12.8%; Hagemeier & Leuschner 2019 (overcast, diffuse PAR))"

[[trait]]
name = "lone.widestAt"
target = 0.5
band = 0.15
weight = 0.5
kind = "described"
source = "a broad, rounded crown, widest about its middle"

[[trait]]
name = "lone.crownFullness"
target = 0.72
band = 0.1
weight = 0.5
kind = "described"
source = "a rounded, full crown (an ellipse is 0.79)"

[[trait]]
name = "lone.forkHeight"
target = 0.3
band = 0.15
weight = 0.5
kind = "described"
source = "decurrent: the trunk divides low into a few big limbs (§9; M26 note)"

[[trait]]
name = "lone.leaderDominance"
target = 1.3
band = 0.5
weight = 0.5
kind = "described"
source = "apical control fades early: no leader thicker than its limbs"

[[trait]]
name = "lone.branchAngle"
target = 55
band = 10
weight = 0.5
kind = "described"
source = "wide-angled, spreading limbs (§9; Plate II)"

[[trait]]
name = "lone.limbDroop"
target = 5
band = 10
weight = 0.25
kind = "described"
source = "stiff limbs that reach out level, twisting rather than arching"

[[trait]]
name = "stand.lateShare"
target = 1.31
band = 0.06
weight = 1
kind = "measured"
source = "stand height at 100 over height at 60: 1.29–1.33 for oak classes 1–2 (NW-FVA yield tables (Albert et al. 2021))"

[[trait]]
name = "shade.survivalLight"
target = 0.114
band = 0.03
weight = 1
kind = "measured"
source = "lowest light the seedling survives: sessile oak saplings need 11.4% of PAR (Hagemeier & Leuschner 2019); fitted, not held out (ADR 0020 addendum)"

# Laser-scanned woodland oaks (ADR 0024): the 35 live Quercus robur of the Wytham Woods plot
# (Calders et al. 2022, TreeQSM, CC BY 4.0), 10.8–24.4 m tall, measured as form.ts measures the
# model (analysis/experiments/structure_vs_drawing/wytham_targets.py): mean ± SD over trees. The
# stand at season 100 is about their height. Limb shape follows thick wood (r ≥ 5 cm) along each
# node's thickest child; turn is between successive 1 m chords.

[[trait]]
name = "stand.limbStraightness"
target = 0.922
band = 0.04
weight = 1
kind = "measured"
source = "Wytham Woods oaks, chord/path of 3 m windows along limbs: 0.922 ± 0.040 (n = 35; ADR 0024)"

[[trait]]
name = "stand.limbTurn"
target = 20.2
band = 5.5
weight = 1
kind = "measured"
source = "Wytham Woods oaks, median turn between 1 m chords along limbs: 20.2 ± 5.5 °/m (n = 35; ADR 0024)"

[[trait]]
name = "stand.limbTurnP90"
target = 48.9
band = 19.4
weight = 1
kind = "measured"
source = "Wytham Woods oaks, 90th-percentile turn along limbs: 48.9 ± 19.4 °/m (n = 35; ADR 0024)"

[[trait]]
name = "stand.forkHeight"
target = 0.446
band = 0.146
weight = 1
kind = "measured"
source = "Wytham Woods oaks, relative height where the trunk forks (form.ts's rule): 0.446 ± 0.146 (n = 35; ADR 0024)"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale. L_h spans 10–200 for
# every species: the hyperbolic discount needs larger values than the exponential (ADR 0021).
# r2.hJ is the juvenile height (ADR 0022): shoots lengthen as the tree grows to it.
[[param]]
path = "c3.alpha"
lo = 2.5
hi = 6
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 25
hi = 70
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1.5
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"
lo = 0.015
hi = 0.05
[[param]]
path = "r1.Lh"
lo = 10
hi = 200
log = true
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.6
log = true
[[param]]
path = "r3.gamma"
lo = 0.02
hi = 1
log = true
[[param]]
path = "r3.betaG"
lo = 0.02
hi = 0.5
log = true
[[param]]
path = "c4.sigma"
lo = 5
hi = 60
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3
[[param]]
path = "r2.hJ"
lo = 2
hi = 150
log = true

# Assignments every candidate carries unchanged (analysis/treesim/fit.py).
[fixed]
"r1.hydraulic" = "hyperbolic"   # 1/(1 + L_path/L_h): height keeps rising slowly (ADR 0021)
"r3.proprioception" = "dominant"   # posture senses the corner where a lateral took over (ADR 0024)

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
survivalLight = [0.08, 0.14]   # lowest light all seedlings survive (Hagemeier & Leuschner 2019: sessile oak saplings need 11.4%; Ligot et al. 2013)
shadeScore = 2.45   # Niinemets & Valladares 2006, Appendix A
