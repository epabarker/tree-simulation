# M27 fit targets: rowan (Sorbus aucuparia). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "rowan"

[[trait]]
name = "stand.height"
target = 60
band = 14
weight = 0.5
kind = "described"
source = "≈ 15 m at 60 years: the same fitted curve gives 15.5 m forest top height; field guides 10–15 m mature"

[[trait]]
name = "lone.earlyShare"
target = 0.74
band = 0.08
weight = 0.5
kind = "described"
source = "height at 30 over height at 60: 0.735 on a Chapman–Richards curve fitted through rowan's published growth facts (80 cm a year young, slowing after ≈ 20, level with spruce to 45; LWF Nr. 17; Swiss NFI)"

[[trait]]
name = "lone.spread"
target = 0.6
band = 0.15
weight = 0.5
kind = "described"
source = "an open, oval crown, taller than wide (field guides)"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 1
kind = "measured"
source = "open-grown trees are squat, H/D ≈ 40–55 (MacFarlane et al. 2017)"

[[trait]]
name = "stand.slenderness"
target = 70
band = 10
weight = 1
kind = "measured"
source = "stand-grown H/D 60–80 (Watt et al. 2023)"

[[trait]]
name = "stand.crownRatio"
target = 0.45
band = 0.1
weight = 0.5
kind = "described"
source = "light-demanding: the crown lifts in a stand (Kothari et al. 2025)"

[[trait]]
name = "stand.floor"
target = 0.075
band = 0.03
weight = 0.5
kind = "described"
source = "7.5% (5–12%), estimated from Hagemeier & Leuschner 2019's five measured species: ln(floor %) = 4.92 − 1.08 × Niinemets & Valladares score, cross-checked by LAI and Beer–Lambert (user's research, analysis/fit/sources/floor_light_targets.csv); anchored near oak's measured 8.4% (same score)"

[[trait]]
name = "lone.widestAt"
target = 0.5
band = 0.15
weight = 0.5
kind = "described"
source = "an oval crown, widest about its middle"

[[trait]]
name = "lone.crownFullness"
target = 0.68
band = 0.1
weight = 0.5
kind = "described"
source = "an open oval"

[[trait]]
name = "lone.forkHeight"
target = 0.6
band = 0.2
weight = 0.5
kind = "described"
source = "a stem that often divides part-way up"

[[trait]]
name = "lone.leaderDominance"
target = 2
band = 0.8
weight = 0.5
kind = "described"
source = "moderate apical control"

[[trait]]
name = "lone.branchAngle"
target = 35
band = 8
weight = 0.5
kind = "described"
source = "steep, ascending limbs (M25)"

[[trait]]
name = "lone.limbDroop"
target = 5
band = 10
weight = 0.25
kind = "described"
source = "steep limbs that hold their angle"

# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale.
# A small tree: L_h may go lower; its limbs are steep.
[[param]]
path = "c3.alpha"
lo = 2.5
hi = 6
[[param]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[param]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[param]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[param]]
path = "r2.levels.1.branchAngle"
lo = 20
hi = 60
[[param]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1.5
log = true
[[param]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[param]]
path = "r2.aC"
lo = 0
hi = 40
[[param]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[param]]
path = "r2.kappa"
lo = 0
hi = 4
[[param]]
path = "c5.Trel"
lo = 0.005
hi = 0.6
[[param]]
path = "c6.r0"
lo = 0.015
hi = 0.05
[[param]]
path = "r1.Lh"
lo = 12
hi = 70
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
survivalLight = [0.08, 0.14]   # lowest light all seedlings survive (oak's band: the same score; saplings estimated to need 11.4%)
shadeScore = 2.73   # Niinemets & Valladares 2006, Appendix A
