# M27 fit targets: goat willow (Salix caprea). Read by analysis/treesim/fit.py.
# Units: 1 cell ≈ 0.25 m, 1 season = 1 year (ROADMAP). Each trait is a trial's trait, the mean
# over seeds; it costs ((mean − target) / band)² × weight. "measured": a number from a study;
# "described": a field-guide description turned into a wide band, at half weight.
# Sources: docs/research/2026-10-28-species-traits.md.

species = "willow"

[[trait]]
# Scale: 1 cell ≈ 0.25 m is uncertain by ±20% (traits note); the two shares are scale-free and
# carry the growth information.
name = "stand.height"
target = 52
band = 14
weight = 1
kind = "measured"
source = "13 m at 60 years: between British field guides (≈ 10 m, up to 15) and taiga tree-willow stands (16.6–18 m, Paramonov et al. 2021)"

[[trait]]
# Lone against stand: a lone tree scored against yield-table top heights (closed stands): assumes
# open-grown trees follow a similar curve, though open-grown height curves run lower and flatter
# (audit §1.4).
name = "lone.earlyShare"
target = 0.73
band = 0.06
weight = 1
kind = "measured"
source = "height at 30 over height at 60: 0.69–0.77 for classes II–I of the tree-willow yield tables of Arkhangelsk (Paramonov, Tretyakov & Koptev 2021; mostly goat willow; mean height × 1.1; age 60 partly extrapolated; analysis/fit/sources/minor_species_growth_curves.csv)"

[[report]]
name = "lone.spread"
target = 1.6
band = 0.4
kind = "described"
source = "broad and low: a many-limbed crown wider than it is tall (M25)"

[[report]]
# Replaces lone.widestAt and lone.crownFullness (round 4): one vector a tiered crown
# cannot satisfy, each band ±0.1, the ten sharing the trait's weight.
name = "lone.profile"
profile = [0.24, 0.6, 0.83, 0.96, 1, 1, 0.96, 0.83, 0.6, 0.24]
band = 0.1
kind = "described"
source = "the crown's width in ten bands, base to top, over its widest: widest at 0.5 of the crown, as full as 0.72 (1 − |u|^q, q = p/(1 − p); the round-4 plan, step C.5). A broad crown, widest about its middle; a broad, full crown"

[[trait]]
name = "lone.slenderness"
target = 48
band = 8
weight = 0.5
kind = "described"
source = "open-grown trees are squat, H/D ≈ 40–55 (MacFarlane et al. 2017): a generic range, no species number found; half weight"

[[trait]]
# Stand density: read in the closed stand at spacing 21 ≈ 5.25 m, ≈ 360 stems/ha: sparser than a
# yield-table stand at 60 (420–1000/ha), which lowers H/D and raises crown ratio against the
# tables (audit §1.4).
name = "stand.slenderness"
target = 70
band = 10
weight = 0.5
kind = "described"
source = "no species-specific stand H/D found: the generic stand range 60–80 (Watt et al. 2023, conifer stands), half weight, so acceptance no longer rests on it"

[[trait]]
# The crown's share of the height to its base by limbs: where the first-order limbs, from the
# bottom up, first hold 5% of the leaf area (metrics' limbCrownRatio, cli/trials.ts): the field's
# live crown base (round 4, ADR 0028).
name = "stand.crownRatio"
target = 0.45
band = 0.12
weight = 0.5
kind = "described"
source = "light-demanding, but sheds less than birch (M25)"

[[report]]
name = "lone.forkHeight"
target = 0.15
band = 0.15
kind = "described"
source = "a short stem that divides low into spreading limbs (M25)"

[[report]]
name = "lone.leaderDominance"
target = 1.1
band = 0.4
kind = "described"
source = "apical control fades almost at once"

[[report]]
name = "lone.branchAngle"
target = 45
band = 10
kind = "described"
source = "spreading, ascending limbs"

[[report]]
name = "lone.limbDroop"
target = 10
band = 10
kind = "described"
source = "limbs that arch outward"

[[trait]]
# Scale-free: the ratio carries the growth curve whatever the cell's size.
name = "stand.lateShare"
target = 1.08
band = 0.06
weight = 0.5
kind = "measured"
source = "stand height at 100 over height at 60: 1.05–1.11 for classes I–II (Paramonov et al. 2021), extrapolated past age 45–65, so half weight"

[[report]]
# Round 5 (ADR 0029): the length-weighted median elevation of the first-order limbs' segments
# (form.rs's limbElevation), read along the limbs: a limb that rises and then arches out level reads
# level, where a chord would read it ascending. No described value: the sheet and the panel judge it.
name = "lone.limbElevation"
kind = "described"

[[report]]
# The profile's summaries (form.rs), reported beside the profile itself.
name = "lone.widestAt"
kind = "described"

[[report]]
name = "lone.crownFullness"
kind = "described"

[[report]]
# The stand's limb crown ratio at 100 beside the scored one at 60: a low T_rel can hold the crown
# at 60 and strip it by 100 (the round-5 plan, §2).
name = "stand.crownRatio100"
kind = "measured"

# Round 5 (ADR 0029): the physiology only; the nine form parameters are [form], by hand.
# Free parameters: dotted paths into the species' patch, with bounds (literature review §4,
# ROADMAP calibration table). log = true searches the bound's log scale. L_h spans 10–200 for
# every species: the hyperbolic discount needs larger values than the exponential (ADR 0021).
# r2.hJ is the juvenile height (ADR 0022): shoots lengthen as the tree grows to it.
# α may go higher (fast, costly leaves).
[[param]]
path = "c3.alpha"
lo = 3
hi = 7
[[param]]
path = "c6.r0"   # ADR 0027's 3D units: the 2D bounds 0.015–0.05 ÷ 8
lo = 0.001875
hi = 0.00625
[[param]]
path = "r1.Lh"
lo = 10
hi = 200
log = true
[[param]]
path = "r1.mf"
lo = 0.02
hi = 0.15
[[param]]
path = "r3.c"
lo = 0.01
hi = 0.3
log = true
[[param]]
path = "r6.qMin"
lo = 0.01
hi = 0.2
log = true
[[param]]
path = "r6.leafArea"
lo = 1
hi = 3
[[param]]
path = "r2.hJ"
lo = 2
hi = 150
log = true

# The form parameters' ranges (round 4's search bounds): the span the form sheet sweeps, never
# searched (ADR 0029).
[[formRange]]
path = "r2.levels.0.lambda"
lo = 0.5
hi = 0.6
[[formRange]]
path = "r2.levels.1.lambda"
lo = 0.48
hi = 0.58
[[formRange]]
path = "r2.levels.1.setPoint"
lo = 20
hi = 90
[[formRange]]
path = "r2.levels.1.postureSetPoint"
lo = 20
hi = 90
[[formRange]]
path = "r2.levels.1.branchAngle"
lo = 25
hi = 70
[[formRange]]
path = "r2.levels.1.eta"
lo = 0.05
hi = 1
log = true
[[formRange]]
path = "r2.levels.2.setPoint"
lo = 40
hi = 160
[[formRange]]
path = "r2.aC"
lo = 0
hi = 40
[[formRange]]
path = "r2.dLambda"
lo = 0
hi = 0.12
[[formRange]]
path = "r2.kappa"
lo = 0
hi = 4

# Assignments every candidate carries unchanged (analysis/treesim/fit.py).
[fixed]
"r1.hydraulic" = "hyperbolic"   # 1/(1 + L_path/L_h): height keeps rising slowly (ADR 0021)
# ADR 0032: T_rel fixed from the lowest shade leaves' light (Hagemeier & Leuschner 2019, % of
# incident PAR; estimated: 13.5% by the score regression; ln(%) = 5.00 − 1.108 × shadeScore over birch, oak, hornbeam, beech),
# and the acclimated leaf cost with one global c. Not fitted.
"c5.Trel" = 0.14
"r1.leafCost" = "acclimated"
"r1.leafCostShade" = 0.3

# The form, by hand (ADR 0029), applied to every candidate like [fixed]. Round 2's adopted
# values (FLORA) as of 2026-10-31, the form sheet's reference cell: the user's picks from the
# sheet replace them, each with a dated comment.
[form]
# 2026-11-01 pick: grid cell 1-3-0 of the ADR 0032 grid (form-grid.py --tag=-adr32), provisional, picked overnight by the agent
# by grid-stand.py's rule (stand alive >= 0.8 at 100, the deepest living crown, then the lone outline).
# The lines marked "pick"; the rest are round 2's.
"r2.levels.0.lambda" = 0.5167
"r2.levels.1.lambda" = 0.4933  # pick, 2026-11-01, provisional
"r2.levels.1.setPoint" = 90  # pick, 2026-11-01, provisional
# "r2.levels.1.postureSetPoint": unset in FLORA, so the limbs straighten toward
# levels.1.setPoint (R3, ADR 0011); a pick sets it here.
"r2.levels.1.branchAngle" = 48.99
"r2.levels.1.eta" = 0.1194
"r2.levels.2.setPoint" = 54  # pick, 2026-11-01, provisional
"r2.aC" = 3.012
"r2.dLambda" = 0.02422
"r2.kappa" = 1.62

# Held out: never in the loss, checked after the fit (analysis/experiments/m27_holdout.py).
[holdout]
# The floor of the species' own wood planted per area at τ 0, at season 100 (m27_holdout.py): the
# one-row stand trial lights its floor through the empty depth beside the row (species plan §0.3).
floor = { target = 0.12, band = 0.05, kind = "described", source = "12% (8–18%), estimated from Hagemeier & Leuschner 2019's five measured species: ln(floor %) = 4.92 − 1.08 × Niinemets & Valladares score, cross-checked by LAI and Beer–Lambert (user's research, analysis/fit/sources/floor_light_targets.csv); near birch's measured 14.8%" }
survivalLight = [0.12, 0.2]   # lowest light all seedlings survive (a shade more tolerant than birch (2.16 against 2.03))
shadeScore = 2.16   # Niinemets & Valladares 2006, Appendix A
