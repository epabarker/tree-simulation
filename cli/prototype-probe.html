<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature probe</title>
<!-- PROTOTYPE (wayfinder: What does a cheap feature probe look like?). Throwaway; filled by cli/prototype-probe.ts. -->
<style>
:root {
  --bg: #f6f4ee; --fg: #222; --muted: #777; --panel: #fff; --rule: #ddd;
  --sky: #eef3f6; --ground: #b9a98a; --wood: #5b4636; --leaf: #4f8a3c; --head: #9a9a9a;
  --accent: #c0392b; --bar: #222; --bar-fg: #fff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --fg: #e8e6e1; --muted: #999; --panel: #212326; --rule: #333;
    --sky: #1d2328; --ground: #5a5040; --wood: #b49a80; --leaf: #7cbc5f; --head: #6d6d6d;
    --accent: #ff7a66; --bar: #e8e6e1; --bar-fg: #111;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px 16px 80px; background: var(--bg); color: var(--fg);
  font: 14px/1.4 system-ui, sans-serif; }
h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 24px 0 8px; }
.meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
code { font-size: 12px; }
.grid { display: grid; gap: 8px; }
.cell { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px; }
.cell canvas { width: 100%; display: block; background: var(--sky); border-radius: 3px; }
.cap { font-size: 12px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.cap b { color: var(--fg); font-weight: 600; }
.rowlab { font-size: 12px; color: var(--muted); align-self: center; }
.delta { color: var(--accent); font-weight: 600; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
td, th { padding: 3px 8px; border-bottom: 1px solid var(--rule); text-align: right; }
th:first-child, td:first-child { text-align: left; }
.legend span { display: inline-block; margin-right: 12px; font-size: 12px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
#bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px;
  align-items: center; background: var(--bar); color: var(--bar-fg); padding: 6px 10px; border-radius: 999px;
  box-shadow: 0 4px 16px #0005; font-size: 13px; z-index: 9; }
#bar button { background: none; border: 0; color: inherit; font-size: 16px; cursor: pointer; padding: 2px 8px; }
.charts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.thumbs { display: flex; gap: 6px; overflow-x: auto; }
.thumbs .cell { flex: 0 0 140px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="bar"><button id="prev" aria-label="previous">◀</button><span id="lab"></span><button id="next" aria-label="next">▶</button></div>
<script>
const DATA = /*DATA*/null;
const CELL = 0.25;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const HUES = [120, 35, 200, 280, 0, 60, 160, 320, 90, 15];
const R = DATA.results;
// One colour per species name across every job (each job numbered species in its own order).
const NAMES = [...new Set(R.flatMap((r) => r.species))].sort();
const spColor = (k, a = 0.75) => `hsla(${HUES[k % HUES.length]}, 45%, 45%, ${a})`;
const nameColor = (r, k) => spColor(NAMES.indexOf(r.species[k]));
const hasPatch = !!DATA.meta.patch;
const get = (kind, seed, p) => R.find((r) => r.kind === kind && r.seed === seed && r.patched === p);
const seasons = (kind) => R.find((r) => r.kind === kind).frames.map((f) => f.season);
const fmt = (x, d = 2) => (x == null || Number.isNaN(x) ? "–" : (+x).toFixed(d));

// Bounds per world kind so every frame of a kind shares one scale.
function bounds(kind) {
  let x0 = Infinity, x1 = -Infinity, y1 = 0;
  for (const r of R.filter((r) => r.kind === kind)) for (const f of r.frames) {
    for (let i = 0; i < f.leaves.length; i += 3) { x0 = Math.min(x0, f.leaves[i]); x1 = Math.max(x1, f.leaves[i]); y1 = Math.max(y1, f.leaves[i + 1]); }
    for (let i = 0; i < f.wood.length; i += 5) { y1 = Math.max(y1, f.wood[i + 3]); }
  }
  if (kind === "garden") { x0 = 0; x1 = R.find((r) => r.kind === kind).width; }
  const pad = 4; return { x0: x0 - pad, x1: x1 + pad, y1: y1 + pad };
}
const B = { lone: bounds("lone"), garden: bounds("garden") };

/** Draw a frame. `ghost` draws it flat grey (the HEAD under a patch, or an earlier season). */
function draw(cv, kind, f, { ghost = false, clear = true, r = null, maxH = 420 } = {}) {
  const b = B[kind], dpr = devicePixelRatio || 1;
  const w = cv.clientWidth || 300, h = Math.min(maxH, Math.round(w * b.y1 / (b.x1 - b.x0)));
  if (clear) { cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + "px"; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = Math.min(w / (b.x1 - b.x0), h / b.y1), ox = (w - (b.x1 - b.x0) * s) / 2, X = (x) => ox + (x - b.x0) * s, Y = (y) => h - y * s;
  if (clear) { g.fillStyle = css("--ground"); g.fillRect(0, h - 2, w, 2); }
  if (!f) return;
  g.lineCap = "round"; g.strokeStyle = ghost ? css("--head") : css("--wood");
  for (let i = 0; i < f.wood.length; i += 5) {
    g.lineWidth = Math.max(0.4, 2 * f.wood[i + 4] * s);
    g.beginPath(); g.moveTo(X(f.wood[i]), Y(f.wood[i + 1])); g.lineTo(X(f.wood[i + 2]), Y(f.wood[i + 3])); g.stroke();
  }
  const d = Math.max(1, 0.6 * s);
  for (let i = 0; i < f.leaves.length; i += 3) {
    g.fillStyle = ghost ? css("--head") + "88" : kind === "lone" ? css("--leaf") : nameColor(r, f.leaves[i + 2]);
    g.fillRect(X(f.leaves[i]) - d / 2, Y(f.leaves[i + 1]) - d / 2, d, d);
  }
}

function canvas(kind, f, opts = {}) {
  const cv = document.createElement("canvas");
  requestAnimationFrame(() => draw(cv, kind, f, opts)); return cv;
}

const NUM = {
  lone: [["heightM", "H m", 1], ["widthM", "W m", 1], ["boleLimb", "bole/limb", 2], ["boleLeaf", "bole/leaf", 2], ["topFull", "top full", 2]],
  garden: [["drawn", "drawn", 0], ["alive", "alive", 0], ["over10m", "≥10 m", 0], ["boleLimbTall", "bole/limb ≥10 m", 2], ["boleLeafTall", "bole/leaf ≥10 m", 2]],
};
const caption = (kind, f, base) => NUM[kind].map(([k, l, d]) => {
  const v = f?.numbers[k], o = base?.numbers[k];
  const delta = base && o != null && v != null && Math.abs(v - o) > 1e-9 ? ` <span class="delta">(${v > o ? "+" : ""}${fmt(v - o, d)})</span>` : "";
  return `${l} <b>${fmt(v, d)}</b>${delta}`;
}).join(" · ");

function header(el, note) {
  const m = DATA.meta;
  el.innerHTML = `<h1>Feature probe: ${m.label}</h1>
  <div class="meta">lone ${m.species} · garden (forestParams, width ${get("garden", m.seeds[0], false).width}) · seeds ${m.seeds.join(", ")} · ${m.date} · ${m.wall.toFixed(0)} s wall · exploratory, never an adoption claim</div>
  <div class="meta">patch: <code>${m.patch ? JSON.stringify(m.patch) : "none (HEAD only)"}</code></div>
  <div class="meta">${note}</div>
  <div class="meta">bole/limb = lowest live first-order limb ÷ H (metrics' boleHeight); bole/leaf = height under 5% of leafy buds ÷ H; top full = leafy width in the crown's top fifth ÷ widest (≈1 flat cap, ≈0.8 dome, ≈0.3 spire); drawn = live stems ≥ 1.3 m.</div>
  <div class="meta legend">garden: ${NAMES.map((n, k) => `<span><i class="sw" style="background:${spColor(k, 1)}"></i>${n}</span>`).join("")}</div>`;
}

// ---- A: the contact sheet. Rows = seed (× HEAD/patch), columns = season. ----
function A(el) {
  header(el, "A · Contact sheet: every frame, seeds down, seasons across. Patched rows show the change from HEAD in red.");
  for (const kind of ["lone", "garden"]) {
    el.insertAdjacentHTML("beforeend", `<h2>${kind === "lone" ? "Lone tree" : "Garden"}</h2>`);
    const ss = seasons(kind);
    const grid = document.createElement("div"); grid.className = "grid";
    grid.style.gridTemplateColumns = `70px repeat(${ss.length}, minmax(0, 1fr))`;
    grid.insertAdjacentHTML("beforeend", `<div></div>` + ss.map((s) => `<div class="rowlab">season ${s}</div>`).join(""));
    for (const seed of DATA.meta.seeds) for (const p of hasPatch ? [false, true] : [false]) {
      grid.insertAdjacentHTML("beforeend", `<div class="rowlab">seed ${seed}<br>${p ? "patch" : "HEAD"}</div>`);
      const r = get(kind, seed, p), base = p ? get(kind, seed, false) : null;
      r.frames.forEach((f, k) => {
        const c = document.createElement("div"); c.className = "cell";
        c.append(canvas(kind, f, { r }));
        c.insertAdjacentHTML("beforeend", `<div class="cap">${caption(kind, f, base?.frames[k])}</div>`);
        grid.append(c);
      });
    }
    el.append(grid);
  }
}

// ---- B: one picture per seed at the last season, the change drawn on top. ----
function B_(el) {
  header(el, hasPatch
    ? "B · Overlay: the last season only, HEAD in grey under the patch in colour, one panel per seed. Numbers as HEAD → patch."
    : "B · Overlay: the last season in colour over the earlier seasons in grey, one panel per seed.");
  for (const kind of ["lone", "garden"]) {
    el.insertAdjacentHTML("beforeend", `<h2>${kind === "lone" ? "Lone tree" : "Garden"} at season ${seasons(kind).at(-1)}</h2>`);
    const grid = document.createElement("div"); grid.className = "grid";
    grid.style.gridTemplateColumns = kind === "lone" ? "repeat(auto-fit, minmax(220px, 1fr))" : "1fr";
    for (const seed of DATA.meta.seeds) {
      const head = get(kind, seed, false), top = get(kind, seed, hasPatch);
      const c = document.createElement("div"); c.className = "cell";
      const cv = document.createElement("canvas"); c.append(cv);
      requestAnimationFrame(() => {
        if (hasPatch) { draw(cv, kind, head.frames.at(-1), { ghost: true, r: head }); draw(cv, kind, top.frames.at(-1), { clear: false, r: top }); }
        else { head.frames.forEach((f, k) => draw(cv, kind, f, { ghost: k < head.frames.length - 1, clear: k === 0, r: head })); }
      });
      const rows = NUM[kind].map(([k, l, d]) => {
        const a = head.frames.at(-1).numbers[k], b = top.frames.at(-1).numbers[k];
        return `<tr><td>${l}</td><td>${fmt(a, d)}</td>${hasPatch ? `<td>${fmt(b, d)}</td>` : ""}</tr>`;
      }).join("");
      c.insertAdjacentHTML("beforeend", `<div class="cap"><b>seed ${seed}</b></div><table><tr><th></th><th>HEAD</th>${hasPatch ? "<th>patch</th>" : ""}</tr>${rows}</table>`);
      grid.append(c);
    }
    el.append(grid);
  }
}

// ---- C: numbers first. Each number over seasons, seeds as lines; pictures as a thumbnail strip. ----
function C(el) {
  header(el, `C · Numbers first: each number every 10 seasons, one line per seed${hasPatch ? " (HEAD grey, patch red)" : ""}; the frames shrink to a strip.`);
  for (const kind of ["lone", "garden"]) {
    el.insertAdjacentHTML("beforeend", `<h2>${kind === "lone" ? "Lone tree" : "Garden"}</h2>`);
    const charts = document.createElement("div"); charts.className = "charts";
    for (const [k, l, d] of NUM[kind]) {
      const c = document.createElement("div"); c.className = "cell";
      c.insertAdjacentHTML("beforeend", `<div class="cap"><b>${l}</b></div>`);
      const cv = document.createElement("canvas"); c.append(cv); charts.append(c);
      requestAnimationFrame(() => line(cv, kind, k, d));
    }
    el.append(charts);
    const strip = document.createElement("div"); strip.className = "thumbs";
    for (const seed of DATA.meta.seeds) for (const p of hasPatch ? [false, true] : [false]) { const r = get(kind, seed, p); r.frames.forEach((f) => {
      const c = document.createElement("div"); c.className = "cell"; c.append(canvas(kind, f, { r }));
      c.insertAdjacentHTML("beforeend", `<div class="cap">s${seed} ${p ? "patch" : "HEAD"} · ${f.season}</div>`); strip.append(c);
    }); }
    el.append(strip);
  }
}
function line(cv, kind, key, d) {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth || 260, h = 140;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.height = h + "px";
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rs = R.filter((r) => r.kind === kind);
  const all = rs.flatMap((r) => r.series.map((s) => s[key])).filter(Number.isFinite);
  const s1 = Math.max(...rs.flatMap((r) => r.series.map((s) => s.season)));
  let lo = Math.min(0, ...all), hi = Math.max(...all, 1e-9);
  const X = (x) => 30 + (x / s1) * (w - 36), Y = (y) => h - 16 - ((y - lo) / (hi - lo)) * (h - 26);
  g.fillStyle = css("--muted"); g.font = "10px system-ui";
  g.fillText(fmt(hi, d), 0, Y(hi) + 4); g.fillText(fmt(lo, d), 0, Y(lo)); g.fillText(`season ${s1}`, w - 60, h - 2);
  for (const r of rs) {
    g.strokeStyle = r.patched ? css("--accent") : hasPatch ? css("--head") : spColor(r.seed - 1, 1);
    g.lineWidth = 1.5; g.beginPath();
    let on = false;
    for (const s of r.series) { const v = s[key]; if (!Number.isFinite(v)) { on = false; continue; }
      on ? g.lineTo(X(s.season), Y(v)) : g.moveTo(X(s.season), Y(v)); on = true; }
    g.stroke();
  }
}

// ---- the switcher ----
const VARIANTS = { A: ["Contact sheet", A], B: ["Overlay", B_], C: ["Numbers first", C] };
const keys = Object.keys(VARIANTS);
function show() {
  const v = new URLSearchParams(location.search).get("variant") ?? "A";
  const key = VARIANTS[v] ? v : "A";
  document.getElementById("lab").textContent = `${key} (${VARIANTS[key][0]})`;
  const app = document.getElementById("app"); app.innerHTML = ""; VARIANTS[key][1](app);
}
function go(step) {
  const v = new URLSearchParams(location.search).get("variant") ?? "A";
  const k = keys[(keys.indexOf(v) + step + keys.length) % keys.length];
  const u = new URL(location.href); u.searchParams.set("variant", k); history.replaceState(null, "", u); show();
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", (e) => {
  if (e.target.closest?.("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1);
});
addEventListener("resize", () => show());
show();
</script>
</body>
</html>
