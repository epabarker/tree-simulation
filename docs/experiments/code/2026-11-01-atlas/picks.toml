# The authored form per species from the atlas (track B, 2026-11-01; the user's decisions as relayed by
# the overseer the same day). Each species' table holds the knobs to add to its targets file's [form]
# (round 5's picks, dated 2026-10-31/2026-11-01), or to replace there where the key exists already
# (beech's levels.1.setPoint, birch's levels.2.setPoint); every other [form] value stays. Track D copies these into
# analysis/fit/targets/<species>.toml [form] after its running fit ends; this track does not edit
# analysis/. Every rule here is off by default in the core (ADRs 0033-0038); the keys turn it on for
# the species alone. The figures are in docs/experiments/figures/, each regenerated by the command in
# its caption (docs/experiments/code/2026-11-01-atlas/atlas.py).

[beech]
# Accepted: "beech's direction (relay + trunk curvature + posture by age)". The seed-robust values:
# 2026-11-01-atlas-combined-beech-aged-60.png (seeds 1-3; the agedOver 50 column), built on
# 2026-11-01-atlas-combined-beech-60.png and the relay and curve sheets.
# The relay (ADR 0033): two laterals under an ended leader take the trunk's level; the leader ends
# with p 0.6 a season from age 20 (atlas-relay-{60,100}.png, the relayPTerm row).
"r2.relay" = 2
"r2.relayAge" = 20
"r2.relayPTerm" = 0.6
# The relays curve 45° over 30 nodes (ADR 0034; atlas-curve-{60,100}.png, the levels.0.curve row;
# atlas-combined-beech-60.png's middle column).
"r2.levels.0.curve" = 45
"r2.levels.0.curveLength" = 30
# Posture by age (ADR 0038): limbs grow steep (set point 28, against round 2's 34.32 in [form]) and
# level toward 80 with their wood's age over 50 seasons (atlas-combined-beech-aged-60.png, the
# agedOver 50 column; atlas-aged-{60,100}.png). agedBy is the default, "wood".
"r2.levels.1.setPoint" = 28
"r2.levels.1.agedSetPoint" = 80
"r2.levels.1.agedOver" = 50

[birch]
# Accepted: "birch's direction with levels.2.lateralEvery 3 (4 noted as the sparser alternative)".
# Figure: 2026-11-01-atlas-combined-birch-{60,100}.png (seeds 1-3; the lateralEvery 3 column).
# Pendulous twigs (ADR 0035): thin twig axes hang at 140° up to radius 0.01; the twig level's own set
# point 45 in place of round 2's 144.8 in [form], so only the thin axes hang (atlas-pendulous-*.png).
"r2.levels.2.setPoint" = 45
"r2.levels.2.pendulous" = 140
"r2.levels.2.pendulousRadius" = 0.01
# Twig density (ADR 0036): twig laterals at every third node (atlas-twigs-{60,100}.png, the
# levels.2.lateralEvery row). The sparser alternative, noted by the user: 4.
"r2.levels.2.lateralEvery" = 3

# The six below: proposed, awaiting the user's judgement (track B, 2026-11-01). Each from its
# combined sheet, 2026-11-01-atlas-combined-<species>-{60,100}.png (seeds 1-3, "today (off)" first,
# the knob across), chosen from track A's identity cards (docs/research/2026-11-01-species-identity.md
# on claude/research) and the atlas. "look for" says what the user should judge on the sheet.

[oak]
# Proposed, awaiting the user's judgement. Posture by age (ADR 0038): limbs steep when young (35,
# against 58.61 in [form]), levelling to 85 with their wood's age over 50 seasons; no relay, no elbows
# (ADR 0037 stays proposed). Sheet: atlas-combined-oak-{60,100}.png, the agedSetPoint 85 column.
# Look for: long, near-level low limbs under a broad crown (W/H 1.39-1.61 at 60 against 1.14-1.33
# today; elev 31 -> 20), track A's "massive lower branches"; 100 levels them further (stiff limbs at
# the base). Still fine-twigged; the heavy girth hierarchy is not a form knob.
"r2.levels.1.setPoint" = 35
"r2.levels.1.agedSetPoint" = 85
"r2.levels.1.agedOver" = 50

[hornbeam]
# Proposed, awaiting the user's judgement, weakly. Beech's direction, smaller: the relay (ADR 0033)
# later, and the relays' curve 30 over 30 (ADR 0034). Sheet: atlas-combined-hornbeam-{60,100}.png,
# the levels.0.curve 30 column. Look for: whether anything rounds the flat cap (ADR 0031). The fork
# drops (0.73 -> 0.54 at 60), but the cap stays across all three curves and seeds, within seed noise of
# today: holding today's form is as defensible.
"r2.relay" = 2
"r2.relayAge" = 25
"r2.relayPTerm" = 0.6
"r2.levels.0.curve" = 30
"r2.levels.0.curveLength" = 30

[maple]
# Proposed, awaiting the user's judgement. The relay from age 10 (ADR 0033), its relays curving 30
# over 30 (ADR 0034). Sheet: atlas-combined-maple-{60,100}.png, the relayAge 10 column. Look for: a
# lower fork and a rounder, broader head (fork 0.68 -> 0.33, W/H 0.62-0.68 -> 0.69-0.75 at 60;
# 0.50 -> 0.56-0.61 at 100), track A's Rauh "low dome". relayAge 5 forks at the base (0.13), a bush.
"r2.relay" = 2
"r2.relayAge" = 10
"r2.relayPTerm" = 0.6
"r2.levels.0.curve" = 30
"r2.levels.0.curveLength" = 30

[willow]
# Proposed, awaiting the user's judgement. Pendulous twigs (ADR 0035) on willow's own twig set point
# (54.03 in [form], unchanged), twig laterals every second node (ADR 0036). Sheet:
# atlas-combined-willow-{60,100}.png, the lateralEvery 2 column. Look for: a broader, low, bushy crown
# (W/H 1.60-1.82 at 60 and 1.59-1.87 at 100, H 71-86, against the brief's broad and low W/H 1.6).
# lateralEvery 3 makes it taller (H 103 at 60, 154 at 100), not a willow. The hang itself is faint at
# this scale, as for birch (ADR 0035).
"r2.levels.2.pendulous" = 140
"r2.levels.2.pendulousRadius" = 0.01
"r2.levels.2.lateralEvery" = 2

[rowan]
# Proposed: no change. Posture by age kept steep (from today's 28 toward 30-50 over 50 seasons;
# atlas-combined-rowan-{60,100}.png) moves nothing visible (elev 49 -> 47-48, W/H within seed noise):
# rowan's limbs are held by its own set point and eta already. Look for: that the three columns read
# as today's; if so, today's [form].

[holly]
# Proposed, awaiting the user's judgement. Posture by age (ADR 0038): the old limbs level from
# today's 62 toward 80 over 50 seasons. Sheet: atlas-combined-holly-{60,100}.png, the agedSetPoint 80
# column. Look for: the dense pyramid kept (fork 0.98-1.00) with its lower limbs flatter (elev 28 ->
# 20), track A's "level to slightly ascending"; the outline barely moves, so "no change" is the
# alternative.
"r2.levels.1.agedSetPoint" = 80
"r2.levels.1.agedOver" = 50
