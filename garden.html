<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Garden · Self-Organizing Trees</title>
    <meta
      name="description"
      content="The home-page view of the simulation: a forest that grows, thins and renews itself."
    />
    <style>
      /* A stand-in for a host page (ADR 0014): the garden fills the window, text sits over the sky. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--sky-bottom);
        color: #2b2a27;
        font: 16px / 1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e6e3dc;
        }
      }
      #garden {
        position: fixed;
        inset: 0;
      }
      .overlay {
        position: relative;
        max-width: 34rem;
        padding: 24px;
        pointer-events: none;
      }
      .overlay h1 {
        margin: 0 0 4px;
        font-size: 24px;
      }
      .overlay p {
        margin: 0;
        opacity: 0.8;
      }
      .overlay a {
        color: inherit;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="garden"></div>
    <main class="overlay">
      <h1>A forest from simple rules</h1>
      <p>
        Buds compete for light; the best-lit branches get the most to grow with; shaded ones are
        shed. Tap a tree to fell it. <a href="./">Open the lab</a>.
      </p>
    </main>
    <script type="module">
      import { mountGarden } from "/src/web/garden.ts";

      // `?bench[&seasons=60]` plays the intro and reports frame costs here (M15).
      const query = new URLSearchParams(location.search);
      const note = document.querySelector(".overlay p");
      const bench = query.has("bench")
        ? {
            seasons: Number(query.get("seasons") ?? 60),
            onDone: (result) => {
              window.bench = result;
              console.log("bench", JSON.stringify(result));
              note.textContent = `bench: draw p95 ${result.drawP95} ms, frame p95 ${result.frameP95} ms, worker ${result.workerMean} ms (${result.metamers} metamers, ${result.renderer}, dpr ${result.dpr})`;
            },
          }
        : undefined;
      // `?specimen` frames Plate II's oak grown in the open (M19); setFocus("forest") returns.
      const specimen = query.has("specimen");
      // `?first` opens on a grown forest from ./first/ (M21; copy dist-garden/first there to try it);
      // `?first=23` on that seed's.
      const firstSeed = Number(query.get("first"));
      const first = query.has("first")
        ? {
            base: "./first",
            ...(await (await fetch("./first/manifest.json")).json()),
            ...(firstSeed > 0 ? { seeds: [firstSeed] } : {}),
          }
        : undefined;
      // `?seed=10` grows that seed's forest (the bench's pinned runs; I3); `?renderer=canvas` forces
      // the Canvas 2D fallback.
      const seed = query.has("seed") ? Number(query.get("seed")) : undefined;
      const renderer = query.get("renderer") === "canvas" ? "canvas2d" : "auto";
      // `?rows=1&spacing=28&recruits=1`: the garden's planting (forestParams' Planting, I3).
      const planting = Object.fromEntries(
        ["rows", "spacing", "recruits"]
          .filter((k) => query.has(k))
          .map((k) => [k, Number(query.get(k))]),
      );
      // Exposed for poking at from the console (and headless checks); a host page needn't.
      window.garden = mountGarden(document.getElementById("garden"), {
        headroom: 140,
        bench,
        specimen: "oak",
        focus: specimen ? "specimen" : "forest",
        first,
        seed,
        renderer,
        planting,
      });
    </script>
  </body>
</html>
