<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Self-Organizing Trees</title>
    <meta
      name="description"
      content="Trees that grow from simple local rules: buds compete for light in a shared 2D world."
    />
  </head>
  <body>
    <main class="app">
      <section class="stage">
        <h1 class="title">Self-organizing trees</h1>
        <p class="hint">Drag to pan · pinch or scroll to zoom · double-tap to fit · tap a tree to fell it</p>
        <canvas id="view" aria-label="Tree growth simulation"></canvas>
        <div class="hud" id="hud"></div>
      </section>
      <aside class="panel" id="panel" aria-label="Controls"></aside>
      <section class="charts" id="charts" aria-label="Charts"></section>
    </main>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
